[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
robinhood_mainnet = "${ROBINHOOD_MAINNET_RPC_URL}"

[etherscan]
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY:-}", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
robinhood_mainnet = { key = "${BLOCKSCOUT_API_KEY:-}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
